<?xml version="1.0" encoding="utf-8"?>
<!--
     The toolbar icon: the WilcoATC mark -- the aeroplane of logo-wilco.svg,
     in a rounded square.

     FLAT SHAPES, NOT STROKES, AND NO fill ATTRIBUTE. That is the convention of
     the simulator's toolbar icons, read off the ones that work (FSLTL): the
     shapes are solid with no declared colour, and the simulator tints the
     icon for the button's state (resting, hovered, panel open). An icon drawn
     in white strokes does not follow those states and may show nothing. The
     square is therefore a ring cut out of a solid shape (evenodd), not a
     stroke.

     NO width OR height, only a viewBox: the button sizes the icon itself.
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <path fill-rule="evenodd" d="M18 4h28a14 14 0 0 1 14 14v28a14 14 0 0 1-14 14H18A14 14 0 0 1 4 46V18A14 14 0 0 1 18 4zm0 4.5A9.5 9.5 0 0 0 8.5 18v28a9.5 9.5 0 0 0 9.5 9.5h28a9.5 9.5 0 0 0 9.5-9.5V18A9.5 9.5 0 0 0 46 8.5z"/>
  <g transform="translate(32 32.6) rotate(-45) scale(0.082) translate(-256 -256)">
    <path d="M256 16 C270 16 282 40 284 80 L286 190 L470 320 L470 352 L286 300 L282 410 L340 455 L340 478 L280 462 L272 490 C266 500 246 500 240 490 L232 462 L172 478 L172 455 L230 410 L226 300 L42 352 L42 320 L226 190 L228 80 C230 40 242 16 256 16 Z"/>
  </g>
</svg>
